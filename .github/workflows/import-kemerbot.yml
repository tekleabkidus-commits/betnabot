name: Import Kemerbot project into BetnaBot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-kemerbot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BetnaBot
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy tracked Kemerbot files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/tekleabkidus-commits/kemerbot.git /tmp/kemerbot-source
          source_sha=$(git -C /tmp/kemerbot-source rev-parse HEAD)
          git -C /tmp/kemerbot-source ls-files -z | tar -C /tmp/kemerbot-source --null -T - -cf - | tar -xf -
          rm -f .github/workflows/import-kemerbot.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import Kemerbot project files from $source_sha"
          git push origin HEAD:main
